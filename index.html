<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chladni Figure Visualizer</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen p-4">
<div class="max-w-2xl mx-auto">
  <h1 class="text-2xl font-bold text-center text-cyan-400 mb-1">Chladni Figure Visualizer</h1>
  <p class="text-center text-gray-400 text-sm mb-4">Standing wave nodal patterns on a vibrating plate</p>

  <!-- Controls -->
  <div class="bg-gray-800 rounded-xl p-4 mb-4">
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <div>
        <label class="text-xs text-gray-300 block mb-1" for="m-input">Mode m: <span id="m-val" class="text-cyan-300">2</span></label>
        <input type="range" id="m-input" min="1" max="8" value="2" class="w-full">
      </div>
      <div>
        <label class="text-xs text-gray-300 block mb-1" for="n-input">Mode n: <span id="n-val" class="text-cyan-300">3</span></label>
        <input type="range" id="n-input" min="1" max="8" value="3" class="w-full">
      </div>
      <div>
        <label class="text-xs text-gray-300 block mb-1" for="threshold-input">Threshold: <span id="thresh-val" class="text-cyan-300">0.10</span></label>
        <input type="range" id="threshold-input" min="0.01" max="0.5" step="0.01" value="0.1" class="w-full">
      </div>
      <div>
        <label class="text-xs text-gray-300 block mb-1">Color Mode:</label>
        <select id="color-mode" class="w-full bg-gray-700 text-white rounded px-2 py-1 text-sm">
          <option value="sand">Sand (B&W)</option>
          <option value="heatmap">Heatmap</option>
          <option value="neon">Neon</option>
        </select>
      </div>
    </div>

    <!-- Presets -->
    <div class="mt-3 flex flex-wrap gap-2">
      <span class="text-xs text-gray-400 self-center">Presets:</span>
      <button class="preset-btn text-xs bg-gray-700 hover:bg-gray-600 px-2 py-1 rounded" data-m="2" data-n="2">(2,2)</button>
      <button class="preset-btn text-xs bg-gray-700 hover:bg-gray-600 px-2 py-1 rounded" data-m="3" data-n="3">(3,3)</button>
      <button class="preset-btn text-xs bg-gray-700 hover:bg-gray-600 px-2 py-1 rounded" data-m="4" data-n="1">(4,1)</button>
      <button class="preset-btn text-xs bg-gray-700 hover:bg-gray-600 px-2 py-1 rounded" data-m="3" data-n="4">(3,4)</button>
      <button class="preset-btn text-xs bg-gray-700 hover:bg-gray-600 px-2 py-1 rounded" data-m="5" data-n="4">(5,4)</button>
      <button id="btn-animate" class="text-xs bg-cyan-800 hover:bg-cyan-700 px-2 py-1 rounded">Animate Sand</button>
    </div>
  </div>

  <!-- Canvas -->
  <div class="bg-gray-900 rounded-xl p-3 flex justify-center">
    <canvas id="canvas" width="500" height="500" class="rounded" style="max-width:100%"></canvas>
  </div>

  <!-- Info -->
  <div class="bg-gray-800 rounded-xl p-3 mt-4">
    <div class="text-xs text-gray-300 font-mono">
      Pattern: u(x,y) = cos(mπx/L)·cos(nπy/L) − cos(nπx/L)·cos(mπy/L)
    </div>
    <div id="freq-display" class="text-xs text-cyan-400 mt-1"></div>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = 500, H = 500;

let animId = null;
let animPhase = 0;
let animRunning = false;

function getM() { return parseInt(document.getElementById('m-input').value); }
function getN() { return parseInt(document.getElementById('n-input').value); }
function getThreshold() { return parseFloat(document.getElementById('threshold-input').value); }
function getColorMode() { return document.getElementById('color-mode').value; }

function chladniVal(x, y, m, n) {
  const px = x / W * Math.PI;
  const py = y / H * Math.PI;
  return Math.cos(m * px) * Math.cos(n * py) - Math.cos(n * px) * Math.cos(m * py);
}

function heatmapColor(val) {
  // val in -1..1, map to color
  const t = (val + 1) / 2; // 0..1
  // Blue-Cyan-Green-Yellow-Red
  const r = Math.min(255, Math.max(0, Math.round(255 * Math.min(1, 2*t))));
  const g = Math.min(255, Math.max(0, Math.round(255 * (1 - Math.abs(2*t-1)))));
  const b = Math.min(255, Math.max(0, Math.round(255 * Math.max(0, 1-2*t))));
  return [r,g,b];
}

function neonColor(val) {
  const absV = Math.abs(val);
  const hue = (1-absV) * 240; // blue=far from node, red=near node
  // Simple hue to RGB
  const h = hue/60;
  const f = h - Math.floor(h);
  const v = Math.round(absV * 255);
  const q = Math.round(v*(1-f));
  const p2 = Math.round(v*f);
  const s = Math.floor(h)%6;
  const colTable = [[v,p2,0],[q,v,0],[0,v,p2],[0,q,v],[p2,0,v],[v,0,q]];
  return colTable[s] || [v,v,v];
}

function render(thresholdOverride) {
  const m = getM(), n = getN();
  const threshold = thresholdOverride !== undefined ? thresholdOverride : getThreshold();
  const colorMode = getColorMode();

  const imageData = ctx.createImageData(W, H);
  const data = imageData.data;

  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const val = chladniVal(x, y, m, n);
      const absVal = Math.abs(val);
      let r, g, b, a = 255;

      if (colorMode === 'sand') {
        if (absVal < threshold) {
          // Sand: white
          r=g=b=240;
        } else {
          // Plate: dark
          r=g=b=20;
        }
      } else if (colorMode === 'heatmap') {
        [r,g,b] = heatmapColor(val);
        if (absVal < threshold) { r=g=b=255; }
      } else { // neon
        if (absVal < threshold) {
          r=g=b=255;
        } else {
          [r,g,b] = neonColor(val);
        }
      }

      const idx = (y*W+x)*4;
      data[idx]=r; data[idx+1]=g; data[idx+2]=b; data[idx+3]=a;
    }
  }
  ctx.putImageData(imageData, 0, 0);
  updateFreq();
}

function updateFreq() {
  const m = getM(), n = getN();
  // Approximate resonant frequency formula (relative)
  const f_rel = Math.sqrt(m*m + n*n);
  document.getElementById('freq-display').textContent =
    `Mode (m=${m}, n=${n}) — Relative frequency ∝ √(${m}²+${n}²) = √${m*m+n*n} ≈ ${f_rel.toFixed(2)} (normalized units)`;
}

function animateSand() {
  if (animRunning) {
    cancelAnimationFrame(animId);
    animRunning = false;
    document.getElementById('btn-animate').textContent = 'Animate Sand';
    render();
    return;
  }
  animRunning = true;
  document.getElementById('btn-animate').textContent = '⏹ Stop';
  let t = 0.5;
  let dir = -1;
  function step() {
    t += dir * 0.005;
    if (t < 0.02) { t = 0.02; dir = 1; }
    if (t > 0.5) { t = 0.5; dir = -1; }
    render(t);
    if (animRunning) animId = requestAnimationFrame(step);
  }
  animId = requestAnimationFrame(step);
}

// Events
document.getElementById('m-input').addEventListener('input', e => {
  document.getElementById('m-val').textContent = e.target.value;
  render();
});
document.getElementById('n-input').addEventListener('input', e => {
  document.getElementById('n-val').textContent = e.target.value;
  render();
});
document.getElementById('threshold-input').addEventListener('input', e => {
  document.getElementById('thresh-val').textContent = parseFloat(e.target.value).toFixed(2);
  render();
});
document.getElementById('color-mode').addEventListener('change', render);
document.getElementById('btn-animate').addEventListener('click', animateSand);
document.querySelectorAll('.preset-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.getElementById('m-input').value = btn.dataset.m;
    document.getElementById('n-input').value = btn.dataset.n;
    document.getElementById('m-val').textContent = btn.dataset.m;
    document.getElementById('n-val').textContent = btn.dataset.n;
    if (animRunning) { cancelAnimationFrame(animId); animRunning=false; document.getElementById('btn-animate').textContent='Animate Sand'; }
    render();
  });
});

render();
</script>
</body>
</html>
